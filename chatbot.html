<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Admission Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }

        .loading {
            display: flex;
            gap: 5px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
        }

        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-area button:active {
            transform: translateY(0);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .citations {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            padding: 8px;
            background: #fafafa;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .citation-item {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Admission Assistant</h1>
            <p>Ask about admission requirements and deadlines</p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-area">
            <input 
                type="text" 
                id="queryInput" 
                placeholder="Ask about admission requirements..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:7777/api/v1';
        const chatMessages = document.getElementById('chatMessages');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) return;

            // Disable input
            queryInput.disabled = true;
            sendBtn.disabled = true;

            // Add user message
            addMessage(query, 'user');
            queryInput.value = '';

            // Add loading indicator
            const loadingId = addMessage('', 'bot', true);

            try {
                const response = await fetch(`${API_BASE}/chat/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();

                // Add bot response
                let botMessage = data.answer || 'No answer found.';
                addMessage(botMessage, 'bot');

                // Add citations if available
                if (data.citations && data.citations.length > 0) {
                    let citationsHtml = '<div class="citations"><strong>Sources:</strong>';
                    data.citations.forEach(c => {
                        citationsHtml += `<div class="citation-item">[${c.i}] ${c.source} (relevance: ${(c.score * 100).toFixed(0)}%)</div>`;
                    });
                    citationsHtml += '</div>';
                    const citDiv = document.createElement('div');
                    citDiv.innerHTML = citationsHtml;
                    chatMessages.appendChild(citDiv);
                }

            } catch (error) {
                // Remove loading
                document.getElementById(loadingId).remove();
                addMessage(`Error: ${error.message}`, 'bot');
            } finally {
                // Re-enable input
                queryInput.disabled = false;
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }

        function addMessage(text, sender, isLoading = false) {
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (isLoading) {
                contentDiv.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            } else {
                contentDiv.textContent = text;
            }

            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return id;
        }

        // Add initial greeting
        window.addEventListener('load', () => {
            addMessage('👋 Hi! I\'m your admission assistant. Ask me about SNU MS ML program requirements, deadlines, or any admission-related questions!', 'bot');
            queryInput.focus();
        });
    </script>
</body>
</html>
