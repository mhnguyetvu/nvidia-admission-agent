[project]
name = "nvidia-admission-agent"
version = "0.1.0"
description = "Agentic RAG chatbot for university admissions (Fall 2026-2027) powered by NVIDIA RAG Blueprint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "langgraph>=0.2,<1",
    "langchain-openai>=0.3,<1",
    "langchain-core>=0.3,<1",
    "openai>=1.60,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
