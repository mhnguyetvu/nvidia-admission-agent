# ─────────────────────────────────────────────────────────────────
# docker compose up -d admission-agent
#
# Local ChromaDB setup for the admission agent gateway.
# ─────────────────────────────────────────────────────────────────

services:
  # ── Your gateway application ─────────────────────────────────
  admission-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admission-agent
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:9000"
    env_file:
      - .env
    volumes:
      # Mount local docs so you can ingest from inside the container
      - ./data/docs:/app/data/docs:ro
      # Mount ChromaDB data to persist between containers
      - ./chroma_data:/app/chroma_data
    networks:
      - local-net

networks:
  local-net:
    driver: bridge
